<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surendra Happy Diwali 🎆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(circle at bottom, #000, #03020a);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Poppins', sans-serif;
    color: #fff;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
  }

  #touchText {
    position: absolute;
    bottom: 30px;
    font-size: 1.4rem;
    color: #ffd700;
    text-shadow: 0 0 10px #ff9900, 0 0 25px #ffaa00;
    animation: pulse 1.5s infinite alternate;
    cursor: pointer;
  }

  @keyframes pulse {
    from { transform: scale(1); opacity: 1; }
    to { transform: scale(1.2); opacity: 0.6; }
  }

  #diwaliText {
    position: absolute;
    font-size: 2.5rem;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 25px #ffbf00, 0 0 50px #ff8c00, 0 0 80px #ff4d00;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }

  .smoke {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
    opacity: 0;
    transition: opacity 2s ease-in-out;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="fireworks"></canvas>
<div id="diwaliText">🎇Surendra Happy Diwali🎆</div>
<div id="touchText">✨ Touch to Open ✨</div>
<div class="smoke" id="smoke"></div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

class Particle {
  constructor(x, y, color, speed, size) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.speed = speed;
    this.size = size;
    this.angle = Math.random() * 2 * Math.PI;
    this.alpha = 1;
  }

  update() {
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed + 1;
    this.alpha -= 0.015;
  }

  draw() {
    ctx.globalAlpha = this.alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
    ctx.fillStyle = this.color;
    ctx.fill();
  }
}

function createRocket() {
  const x = Math.random() * canvas.width;
  const y = canvas.height;
  const color = `hsl(${Math.random() * 360}, 100%, 60%)`;
  const rocket = { x, y, color, vy: -(6 + Math.random() * 3) };

  const rocketInterval = setInterval(() => {
    ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    rocket.y += rocket.vy;
    ctx.beginPath();
    ctx.arc(rocket.x, rocket.y, 4, 0, 2 * Math.PI);
    ctx.fillStyle = rocket.color;
    ctx.fill();

    if (rocket.y < 200 + Math.random() * 100) {
      explode(rocket.x, rocket.y, rocket.color);
      clearInterval(rocketInterval);
    }
  }, 30);
}

function explode(x, y, color) {
  for (let i = 0; i < 100; i++) {
    particles.push(new Particle(x, y, color, Math.random() * 5, 2 + Math.random() * 2));
  }

  const smoke = document.getElementById("smoke");
  smoke.style.opacity = 1;
  setTimeout(() => (smoke.style.opacity = 0), 2500);

  const diwaliText = document.getElementById("diwaliText");
  diwaliText.style.opacity = 1;
  setTimeout(() => (diwaliText.style.opacity = 0), 4000);
}

function animate() {
  ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, i) => {
    p.update();
    p.draw();
    if (p.alpha <= 0) particles.splice(i, 1);
  });
  requestAnimationFrame(animate);
}
animate();

document.getElementById("touchText").addEventListener("click", () => {
  createRocket();
  document.getElementById("touchText").style.display = "none";
});
</script>
</body>
</html>
