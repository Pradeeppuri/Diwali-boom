<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Diwali Boom — Surendra</title>
  <style>
    html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:system-ui,Arial}
    #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
    #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:auto}
    .open-btn{
      background: linear-gradient(90deg,#ff9a00,#ff3d00);
      color:#fff;padding:16px 26px;border-radius:12px;font-weight:800;font-size:18px;
      box-shadow:0 10px 30px rgba(255,60,0,0.35);cursor:pointer;user-select:none;
      -webkit-user-select:none;
    }
    .hint{position:absolute;bottom:20px;width:100%;text-align:center;color:#fff8;font-size:13px;pointer-events:none;z-index:22}
    canvas{display:block;width:100%;height:100%}
    #preview{position:absolute;top:18px;left:18px;width:84px;height:84px;border-radius:16px;overflow:hidden;
      box-shadow:0 6px 18px rgba(0,0,0,0.6);z-index:22;background:#111;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
    /* white smoke overlay - initially hidden */
    #smoke {
      position:fixed;inset:0;z-index:18;pointer-events:none;opacity:0;transition:opacity 1.2s ease;
      display:flex;align-items:center;justify-content:center;
      background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.55) 10%, rgba(255,255,255,0.18) 30%, rgba(0,0,0,0) 80%);
      backdrop-filter: blur(6px);
    }
    /* big greeting text */
    #greet {
      position:fixed;inset:0;z-index:26;display:flex;align-items:center;justify-content:center;pointer-events:none;
      opacity:0; transform:scale(0.9);
    }
    .greet-txt {
      color:#fff; font-size:clamp(22px,6vw,64px); text-align:center; font-weight:900;
      text-shadow: 0 6px 18px rgba(0,0,0,0.6), 0 0 30px rgba(255,200,60,0.18);
      letter-spacing:1px;padding:10px 20px;border-radius:12px;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      transform-origin:center;
    }
    /* animation classes applied by JS */
    .show-smoke{opacity:1}
    .show-greet{opacity:1; transform:scale(1); transition:opacity 1s ease, transform 0.9s cubic-bezier(.2,.9,.2,1)}
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="overlay">
    <div class="open-btn" id="openBtn">OPEN</div>
  </div>

  <div id="preview"><div style="font-size:12px;padding:6px;text-align:center">Touch ➤ Boom</div></div>
  <div class="hint">Tap OPEN — mobile friendly. (Tap required for fullscreen & sound)</div>

  <div id="smoke"></div>

  <div id="greet"><div class="greet-txt" id="greetText">Surendra — Happy Diwali Mubarak ho</div></div>

  <!-- three.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

  <script>
/*
  Updated Diwali effect:
  - Rockets (few bright projectiles) launch upward then explode.
  - Explosion = particle burst with radial velocities.
  - After explosion: show white smoke overlay (full screen) + greeting text animation.
  - All interactions must start inside user gesture (click/tap).
  - Place optional sounds in repo root: rocket.mp3, explosion.mp3
*/

(() => {
  const app = document.getElementById('app');
  const overlay = document.getElementById('overlay');
  const openBtn = document.getElementById('openBtn');
  const smoke = document.getElementById('smoke');
  const greet = document.getElementById('greet');
  const greetText = document.getElementById('greetText');

  // Three.js basics
  let scene, camera, renderer, clock;
  let rockets = []; // simple rocket objects
  let particles = null;
  let exploded = false;
  let rocketLaunchSound = new Audio('rocket.mp3');
  let explosionSound = new Audio('explosion.mp3');

  init();

  function init(){
    scene = new THREE.Scene();
    clock = new THREE.Clock();

    const w = window.innerWidth, h = window.innerHeight;
    camera = new THREE.PerspectiveCamera(60, w/h, 0.1, 2000);
    camera.position.z = 150;

    renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
    renderer.setSize(w,h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    app.appendChild(renderer.domElement);
    window.addEventListener('resize', onResize);

    // soft ambient + point for shine
    scene.add(new THREE.HemisphereLight(0xfff1d6, 0x220022, 0.8));
    const p = new THREE.PointLight(0xffddaa, 1.2, 800); p.position.set(0,100,50); scene.add(p);

    // ground-ish faint plane (for reference)
    const gridGeo = new THREE.PlaneGeometry(2000,2000);
    const gridMat = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0});
    const ground = new THREE.Mesh(gridGeo, gridMat); ground.position.y = -400; scene.add(ground);

    // initial tiny ambient particles to hint
    createIdleParticles();

    animate();
  }

  function createIdleParticles(){
    // small sparkle cloud near bottom center (not the main explosion)
    const COUNT = 300;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(COUNT*3);
    const colors = new Float32Array(COUNT*3);
    for(let i=0;i<COUNT;i++){
      positions[i*3+0] = (Math.random()-0.5)*60;
      positions[i*3+1] = -30 + Math.random()*30;
      positions[i*3+2] = (Math.random()-0.5)*20;
      const r = 0.9, g = 0.5 + Math.random()*0.3, b = 0.05;
      colors[i*3+0]=r; colors[i*3+1]=g; colors[i*3+2]=b;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions,3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors,3));
    const mat = new THREE.PointsMaterial({size:4, vertexColors:true, transparent:true, opacity:0.9, depthWrite:false});
    const pts = new THREE.Points(geometry, mat);
    pts.name = 'idle';
    scene.add(pts);
  }

  // create rockets, small bright spheres that move up then explode
  function launchRockets(count = 4){
    // play rocket sound (if available)
    rocketLaunchSound.currentTime = 0; rocketLaunchSound.play().catch(()=>{});
    const group = new THREE.Group();
    scene.add(group);

    for(let i=0;i<count;i++){
      const geo = new THREE.SphereGeometry(2.8,8,8);
      const mat = new THREE.MeshBasicMaterial({color: 0xffd76b});
      const mesh = new THREE.Mesh(geo, mat);
      // start near bottom with slight left/right offset
      mesh.position.set((i - (count-1)/2) * 22 + (Math.random()-0.5)*8, -120 + Math.random()*6, (Math.random()-0.5)*30);
      // target peak height
      const peak = 40 + Math.random()*40;
      rockets.push({
        mesh, peak, vy: 220 + Math.random()*120, alive: true, wobble: Math.random()*0.8
      });
      group.add(mesh);
    }
  }

  // create main particle explosion at a position
  function createExplosion(worldPos, power = 1.0){
    // remove idle points for clarity
    const idle = scene.getObjectByName('idle');
    if(idle) scene.remove(idle);

    const COUNT = 1600;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(COUNT*3);
    const velocities = new Float32Array(COUNT*3);
    const colors = new Float32Array(COUNT*3);

    for(let i=0;i<COUNT;i++){
      // start at worldPos with tiny jitter
      positions[i*3+0] = worldPos.x + (Math.random()-0.5)*4;
      positions[i*3+1] = worldPos.y + (Math.random()-0.5)*4;
      positions[i*3+2] = worldPos.z + (Math.random()-0.5)*4;

      // random radial velocities (stronger for larger power)
      const theta = Math.random()*Math.PI*2;
      const phi = Math.acos(2*Math.random()-1);
      const speed = (50 + Math.random()*380) * power;
      velocities[i*3+0] = Math.sin(phi)*Math.cos(theta)*speed;
      velocities[i*3+1] = Math.sin(phi)*Math.sin(theta)*speed;
      velocities[i*3+2] = Math.cos(phi)*speed;

      // warm colors
      const r = 0.9 + Math.random()*0.1;
      const g = 0.3 + Math.random()*0.7;
      const b = 0.05 * Math.random();
      colors[i*3+0]=r; colors[i*3+1]=g; colors[i*3+2]=b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions,3));
    geometry.setAttribute('aVelocity', new THREE.BufferAttribute(velocities,3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors,3));

    const mat = new THREE.PointsMaterial({size:6, vertexColors:true, transparent:true, opacity:1.0, depthWrite:false});
    particles = new THREE.Points(geometry, mat);
    scene.add(particles);

    // small bright flash - a sprite-like expanding sphere
    const flashGeo = new THREE.SphereGeometry(6 * power, 16, 8);
    const flashMat = new THREE.MeshBasicMaterial({color:0xfff2c8, transparent:true, opacity:0.9});
    const flash = new THREE.Mesh(flashGeo, flashMat);
    flash.position.copy(worldPos);
    scene.add(flash);

    // audio
    explosionSound.currentTime = 0; explosionSound.play().catch(()=>{});

    // schedule flash fade
    setTimeout(()=> {
      // fade flash quickly
      const start = performance.now();
      const dur = 400;
      (function ff(t){
        const p = (t - start)/dur;
        if(p>=1){ scene.remove(flash); return; }
        flash.material.opacity = 0.9 * (1 - p);
        requestAnimationFrame(ff);
      })(start);
    }, 50);

    // after small delay show smoke + greeting
    setTimeout(()=> {
      showSmokeAndText();
    }, 700);
  }

  function showSmokeAndText(){
    smoke.classList.add('show-smoke');
    greet.classList.add('show-greet');

    // animate greet text slightly (pulse)
    greetText.style.transition = 'transform 0.9s cubic-bezier(.2,.9,.2,1), opacity 1s';
    greetText.style.transform = 'scale(1)';
    // optional vibration
    if(navigator.vibrate) navigator.vibrate([80,40,100]);

    // gentle auto-fade of smoke after some time
    setTimeout(()=> {
      smoke.classList.remove('show-smoke');
      // keep greeting longer, then fade
      setTimeout(()=> {
        greet.classList.remove('show-greet');
      }, 3000);
    }, 4000);
  }

  // main animate loop
  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);

    // rockets update
    for(let i=rockets.length-1;i>=0;i--){
      const r = rockets[i];
      if(!r.alive) continue;
      r.mesh.position.y += r.vy * dt;
      r.mesh.position.x += Math.sin(clock.elapsedTime * (1 + r.wobble)) * 0.2 * (i - rockets.length/2);
      // slight z wobble
      r.mesh.position.z += Math.sin(clock.elapsedTime * (0.6 + r.wobble)) * 0.4;

      // when near peak -> explode at that rocket
      if(r.mesh.position.y >= r.peak){
        // make small flash at rocket tip and create explosion at rocket position
        const worldPos = new THREE.Vector3();
        r.mesh.getWorldPosition(worldPos);
        // remove rocket visual
        scene.remove(r.mesh);
        r.alive = false;
        // trigger explosion from this rocket (use power scaled by index)
        createExplosion(worldPos, 1.0 + (Math.random()*0.8));
      }
    }

    // explosion particle physics
    if(particles){
      const pos = particles.geometry.getAttribute('position');
      const vel = particles.geometry.getAttribute('aVelocity');
      const COUNT = pos.count;
      for(let i=0;i<COUNT;i++){
        let vx = vel.getX(i), vy = vel.getY(i), vz = vel.getZ(i);
        // gravity, drag
        vy -= 130 * dt;
        vx *= (1 - 0.08*dt);
        vy *= (1 - 0.012*dt);
        vz *= (1 - 0.08*dt);
        pos.setX(i, pos.getX(i) + vx*dt);
        pos.setY(i, pos.getY(i) + vy*dt);
        pos.setZ(i, pos.getZ(i) + vz*dt);
        vel.setXYZ(i, vx, vy, vz);
      }
      pos.needsUpdate = true;
      vel.needsUpdate = true;

      // fade out
      particles.material.size = Math.max(0, particles.material.size - 0.03);
      particles.material.opacity = Math.max(0, particles.material.opacity - 0.0018);

      // remove when nearly invisible
      if(particles.material.opacity <= 0.02){
        scene.remove(particles);
        particles = null;
      }
    }

    renderer.render(scene, camera);
  }

  function onResize(){
    const w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setSize(w,h);
  }

  // user gesture handler (must be user invoked to allow fullscreen + sound)
  openBtn.addEventListener('click', async (e) => {
    // fullscreen
    const elem = document.documentElement;
    if(elem.requestFullscreen) await elem.requestFullscreen().catch(()=>{});
    else if(elem.webkitRequestFullscreen) await elem.webkitRequestFullscreen();

    // play short UI click if allowed
    try { void rocketLaunchSound.play(); } catch(e){}

    // hide overlay after a small ripple effect
    setTimeout(()=> overlay.style.display = 'none', 200);

    // launch rockets
    launchRockets(4);

    // schedule additional "salvo" for stronger effect
    setTimeout(()=> launchRockets(3), 650);
    setTimeout(()=> launchRockets(2), 1100);
  });

  // small safety: if user taps preview, show overlay again
  document.getElementById('preview').addEventListener('click', ()=> {
    overlay.style.display = 'flex';
  });

  // Prevent double-tap zoom
  let lastTouch=0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();
    if(now - lastTouch <= 300) e.preventDefault();
    lastTouch = now;
  }, {passive:false});

})();
  </script>
</body>
</html>
